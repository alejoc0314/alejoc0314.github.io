<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No encontrada · Alejandro Cañas</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml" />
  <!-- GitHub Pages sirve esta página para cualquier ruta que no exista, a cualquier profundidad:
       por eso las rutas son absolutas y los estilos van aquí mismo. -->
  <style>
    @font-face {
      font-family: 'Inter Tight'; font-style: normal; font-weight: 400 500; font-display: swap;
      src: url('/assets/fonts/inter-tight-latin.woff2') format('woff2');
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 32px;
      background: #1c1d20; color: #fff; font: 400 18px/1.5 'Inter Tight', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 720px); }
    small { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #a4a6ab; }
    h1 { margin: 18px 0 20px; font-weight: 400; font-size: clamp(2.4rem, 7vw, 5rem); line-height: 1.05; letter-spacing: -.04em; }
    p { max-width: 34ch; color: #c9cacd; }
    nav { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 44px; }
    a { padding: 16px 28px; border: 1px solid #55575d; border-radius: 999px; color: inherit; text-decoration: none; transition: background .3s, color .3s, border-color .3s; }
    a:hover, a:focus-visible { background: #fff; border-color: #fff; color: #1c1d20; outline: none; }
    a.main { background: #6c4df6; border-color: #6c4df6; }
    a.main:hover, a.main:focus-visible { background: #fff; border-color: #fff; }
  </style>
</head>
<body>
  <main>
    <small>Error 404</small>
    <h1>Esta página<br>no existe</h1>
    <p>Puede que el enlace esté viejo o mal escrito. Lo que sí existe está a un clic. <span lang="en">This page does not exist.</span></p>
    <nav aria-label="Salidas">
      <a class="main" href="/">Ir al inicio</a>
      <a href="/trabajo.html">Trabajo</a>
      <a href="/contacto.html">Contacto</a>
    </nav>
  </main>
</body>
</html>
